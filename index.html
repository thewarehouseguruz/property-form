<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Warehouse Guruz - CRM & Reminders</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
    .header-card { background: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%); color: #fff; border-radius: 10px; padding: 10px 12px; }
    .card { border-radius: 10px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    
    /* Responsive Navigation Pills */
    .nav-pills { gap: 4px; display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .nav-pills .nav-link { white-space: nowrap; font-size: 0.82rem; padding: 6px 12px; border-radius: 20px; font-weight: 600; background-color: #e9ecef; color: #495057; }
    .nav-pills .nav-link.active { background-color: #0d6efd; color: #fff; }
    
    .section-header { background-color: #2c3e50; color: #fff; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; margin-bottom: 10px; }
    .btn-whatsapp-save { background-color: #25d366; color: white; font-weight: 700; font-size: 0.95rem; width: 100%; border-radius: 8px; padding: 10px; border: none; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
    .btn-whatsapp-save:active { background-color: #1ebc57; transform: scale(0.98); }
    
    /* Responsive Mobile Cards Table */
    .table-mobile-card { width: 100%; }
    @media (max-width: 768px) {
      .form-label { font-size: 0.78rem; margin-bottom: 2px; }
      .form-control, .form-select { font-size: 0.82rem; padding: 5px 8px; }
      .table-mobile-card thead { display: none; }
      .table-mobile-card tr { display: block; margin-bottom: 8px; border: 1px solid #dee2e6; border-radius: 8px; padding: 8px; background: #fff; }
      .table-mobile-card td { display: flex; justify-content: space-between; border: none !important; padding: 3px 0 !important; font-size: 0.82rem; }
      .table-mobile-card td::before { content: attr(data-label); font-weight: bold; color: #6c757d; }
    }
    
    .timeline-step { border-left: 3px solid #0d6efd; padding-left: 10px; position: relative; margin-bottom: 12px; }
    .timeline-step::before { content: ''; width: 10px; height: 10px; background: #0d6efd; border-radius: 50%; position: absolute; left: -6.5px; top: 4px; }
  </style>
</head>
<body class="py-2">

<div class="container-fluid px-2">

  <!-- Mobile Header -->
  <div class="header-card mb-2">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h6 class="mb-0 fw-bold text-warning" style="font-size: 1rem;">THE WAREHOUSE GURUZ</h6>
        <small class="text-light" style="font-size: 0.7rem;">Property & Reminders CRM</small>
      </div>
      <div>
        <select id="loggedExecutive" class="form-select form-select-sm fw-bold text-dark style="width: auto;">
          <option value="Dipak Sir">Dipak Sir</option>
          <option value="Girish">Girish</option>
          <option value="Bhavik">Bhavik</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Horizontal Scrollable Tabs -->
  <ul class="nav nav-pills mb-2" id="crmTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" id="inquiry-tab" data-bs-toggle="tab" data-bs-target="#inquiryView"><i class="bi bi-pencil-square"></i> 1. Inquiry</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="search-tab" data-bs-toggle="tab" data-bs-target="#searchView" onclick="fetchSheetData()"><i class="bi bi-search"></i> 2. Search DB</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="flow-tab" data-bs-toggle="tab" data-bs-target="#flowView" onclick="fetchSheetData()"><i class="bi bi-diagram-3"></i> 3. Reminders Flow</button>
    </li>
  </ul>

  <div class="tab-content" id="crmTabsContent">
    
    <!-- TAB 1: INQUIRY FORM -->
    <div class="tab-pane fade show active" id="inquiryView">
      <div class="card p-3">
        <form id="mainForm" onsubmit="event.preventDefault(); handleSaveAndWhatsApp();">
          
          <div class="section-header"><i class="bi bi-person-vcard"></i> BASIC DETAILS</div>
          <div class="row g-2 mb-2">
            <div class="col-6 col-md-3">
              <label class="form-label fw-bold">Prop ID</label>
              <input type="text" id="propId" class="form-control bg-light" readonly>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label fw-bold">Inquiry Date</label>
              <input type="text" id="inquiryDate" class="form-control bg-light" readonly>
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label fw-bold">Client Name *</label>
              <input type="text" id="personName" class="form-control" required placeholder="Enter Full Name">
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label fw-bold">Contact Number *</label>
              <input type="tel" id="contactNumber" class="form-control" required placeholder="10-digit Mobile">
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label fw-bold">Company Name</label>
              <input type="text" id="companyName" class="form-control" placeholder="Company Name">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label fw-bold">Property Type</label>
              <select id="propertyType" class="form-select">
                <option value="WAREHOUSE">WAREHOUSE</option>
                <option value="LAND">LAND</option>
                <option value="FACTORY">FACTORY</option>
                <option value="BUNGLOW">BUNGLOW</option>
                <option value="INDUSTRIAL PLOT">INDUSTRIAL PLOT</option>
              </select>
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label fw-bold">Deal For</label>
              <select id="dealFor" class="form-select">
                <option value="BUYER">BUYER</option>
                <option value="TENANT">TENANT</option>
                <option value="LANDLORD">LANDLORD</option>
                <option value="SELLER">SELLER</option>
                <option value="BTS">BTS</option>
                <option value="PRE-LEASE">PRE-LEASE</option>
              </select>
            </div>
          </div>

          <div class="section-header"><i class="bi bi-geo-alt"></i> SPECIFICATIONS & LOCATION</div>
          <div class="row g-2 mb-2">
            <div class="col-12 col-md-4">
              <label class="form-label fw-bold">Property Size</label>
              <div class="input-group">
                <input type="text" id="propertySize" class="form-control" placeholder="Size">
                <select id="sizeUnit" class="form-select" style="max-width: 100px;">
                  <option value="SQ.FT.">SQ.FT.</option>
                  <option value="SQ.YARDS">SQ.YARDS</option>
                  <option value="ACRES">ACRES</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label fw-bold">Area / Location *</label>
              <input type="text" id="area" class="form-control" required placeholder="e.g. Aslali, Changodar">
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label fw-bold">Budget / Rate</label>
              <input type="text" id="budget" class="form-control" placeholder="e.g. 15 Per Sqft">
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Remarks</label>
              <textarea id="remarks" class="form-control" rows="2" placeholder="Property requirements..."></textarea>
            </div>
          </div>

          <div class="mt-2">
            <button type="submit" class="btn btn-whatsapp-save">
              <i class="bi bi-whatsapp"></i> SAVE DATA & SEND WHATSAPP IN 1-CLICK
            </button>
          </div>

        </form>
      </div>
    </div>

    <!-- TAB 2: SEARCH DATABASE -->
    <div class="tab-pane fade" id="searchView">
      <div class="card p-3">
        
        <div class="row g-2 mb-2">
          <div class="col-6 col-md-3">
            <select id="filterType" class="form-select form-select-sm" onchange="applyFilters()">
              <option value="">All Property Types</option>
              <option value="WAREHOUSE">WAREHOUSE</option>
              <option value="LAND">LAND</option>
              <option value="FACTORY">FACTORY</option>
              <option value="BUNGLOW">BUNGLOW</option>
              <option value="INDUSTRIAL PLOT">INDUSTRIAL PLOT</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select id="filterDeal" class="form-select form-select-sm" onchange="applyFilters()">
              <option value="">All Deal Types</option>
              <option value="BUYER">BUYER</option>
              <option value="TENANT">TENANT</option>
              <option value="LANDLORD">LANDLORD</option>
              <option value="SELLER">SELLER</option>
              <option value="BTS">BTS</option>
              <option value="PRE-LEASE">PRE-LEASE</option>
            </select>
          </div>
          <div class="col-8 col-md-4">
            <input type="text" id="filterKeyword" class="form-control form-control-sm" placeholder="Search Name, Phone, Area..." onkeyup="applyFilters()">
          </div>
          <div class="col-4 col-md-2">
            <button class="btn btn-sm btn-secondary w-100" onclick="resetFilters()">Reset</button>
          </div>
        </div>

        <div id="searchStatus" class="small text-muted mb-2">⏳ Loading Google Sheets database...</div>
        <div id="searchResultsContainer"></div>
      </div>
    </div>

    <!-- TAB 3: REMINDERS FLOWCHART -->
    <div class="tab-pane fade" id="flowView">
      <div class="card p-3">
        <div class="section-header"><i class="bi bi-diagram-3-fill"></i> APPLICATION EXECUTIVE FOLLOW-UP FLOWCHART</div>
        
        <div class="bg-light p-2 rounded border mb-3">
          <div class="row g-2">
            <div class="col-6 col-md-3">
              <label class="form-label fw-bold">Executive</label>
              <select id="flowExec" class="form-select form-select-sm">
                <option value="Dipak Sir">Dipak Sir</option>
                <option value="Girish">Girish</option>
                <option value="Bhavik">Bhavik</option>
              </select>
            </div>
            
            <!-- SELECT BUYER / TENANT FROM DATABASE -->
            <div class="col-12 col-md-5">
              <label class="form-label fw-bold">Select Buyer / Tenant Client *</label>
              <select id="flowBuyerSelect" class="form-select form-select-sm" required>
                <option value="">⏳ Loading Buyer/Tenant List from Sheet...</option>
              </select>
            </div>

            <!-- MATCHED MULTIPLE PROPERTY IDS (MAX 5) -->
            <div class="col-12">
              <label class="form-label fw-bold">Matched Property IDs (Select Max 5 Properties) *</label>
              <div class="row g-1">
                <div class="col-4 col-md-2"><select id="matchProp1" class="form-select form-select-sm match-prop-dd"><option value="">ID 1</option></select></div>
                <div class="col-4 col-md-2"><select id="matchProp2" class="form-select form-select-sm match-prop-dd"><option value="">ID 2</option></select></div>
                <div class="col-4 col-md-2"><select id="matchProp3" class="form-select form-select-sm match-prop-dd"><option value="">ID 3</option></select></div>
                <div class="col-6 col-md-3"><select id="matchProp4" class="form-select form-select-sm match-prop-dd"><option value="">ID 4</option></select></div>
                <div class="col-6 col-md-3"><select id="matchProp5" class="form-select form-select-sm match-prop-dd"><option value="">ID 5</option></select></div>
              </div>
            </div>

            <div class="col-6 col-md-3">
              <label class="form-label fw-bold">Visit Date</label>
              <input type="date" id="flowVisitDate" class="form-control form-control-sm">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label fw-bold">Status</label>
              <select id="flowStatus" class="form-select form-select-sm">
                <option value="Shown">Shown</option>
                <option value="Pending Visit">Pending Visit</option>
                <option value="Rejected">Rejected</option>
                <option value="Finalized">Finalized</option>
              </select>
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label fw-bold">Customer Response</label>
              <input type="text" id="flowResponse" class="form-control form-control-sm" placeholder="e.g. Will inform on 10/10/2026">
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label fw-bold">Next Follow-up Date *</label>
              <input type="date" id="flowNextDate" class="form-control form-control-sm" required>
            </div>
            <div class="col-12 mt-2">
              <button class="btn btn-sm btn-primary w-100 fw-bold" onclick="addFollowupEntry()">➕ Add to Follow-up Flowchart</button>
            </div>
          </div>
        </div>

        <h6 class="fw-bold mb-2">📍 Live Flowchart Activity & Reminders</h6>
        <div id="timelineContainer"></div>

      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Sheet URI Configuration
  const sheetId = "1zbB4PFbgtKpYc06MjkGqSTeAVOYpnRznDidvWoANEeA";
  const sheetUriPrimary = `https://opensheet.elk.sh/${sheetId}/Property%20Database`;
  const sheetUriFallback = `https://opensheet.elk.sh/${sheetId}/1`;

  let globalSheetData = [];
  let followUpNodes = JSON.parse(localStorage.getItem('twg_reminders') || '[]');

  function generateID() {
    return 'PROP-' + Math.floor(100 + Math.random() * 900);
  }

  function getFormattedDate() {
    const d = new Date();
    return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('propId').value = generateID();
    document.getElementById('inquiryDate').value = getFormattedDate();
    document.getElementById('flowVisitDate').valueAsDate = new Date();
    renderTimeline();
    fetchSheetData();
  });

  // SAVE & WHATSAPP SENDER
  function handleSaveAndWhatsApp() {
    const execName = document.getElementById('loggedExecutive').value;
    const propId = document.getElementById('propId').value;
    const date = document.getElementById('inquiryDate').value;
    const name = document.getElementById('personName').value;
    const phone = document.getElementById('contactNumber').value;
    const company = document.getElementById('companyName').value || 'N/A';
    const type = document.getElementById('propertyType').value;
    const deal = document.getElementById('dealFor').value;
    const size = document.getElementById('propertySize').value + ' ' + document.getElementById('sizeUnit').value;
    const area = document.getElementById('area').value;
    const budget = document.getElementById('budget').value || 'N/A';
    const remarks = document.getElementById('remarks').value || 'None';

    const newRecord = {
      'Property ID': propId,
      'INQUIRY DATE': date,
      'Type of Property': type,
      'Name': name,
      'Contact Number': phone,
      'Company Name': company,
      'BUYER/SELLER/LANDLORD/TENANT/BTS': deal,
      'Property Size': size,
      'Area': area,
      'Budget': budget,
      'Executive': execName,
      'Remarks': remarks
    };
    globalSheetData.unshift(newRecord);

    let waText = `*THE WAREHOUSE GURUZ*\n`;
    waText += `*Inquiry ID:* ${propId} | *Date:* ${date}\n`;
    waText += `---------------------------------\n`;
    waText += `👤 *Client Name:* ${name}\n`;
    waText += `📞 *Contact:* ${phone}\n`;
    waText += `🏢 *Company:* ${company}\n`;
    waText += `🏗️ *Type:* ${type}\n`;
    waText += `🤝 *Deal For:* ${deal}\n`;
    waText += `📐 *Size:* ${size}\n`;
    waText += `📍 *Area:* ${area}\n`;
    waText += `💰 *Budget:* ${budget}\n`;
    waText += `👨‍💼 *Executive:* ${execName}\n`;
    waText += `📝 *Remarks:* ${remarks}\n`;

    let cleanPhone = phone.replace(/\D/g, '');
    if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

    document.getElementById('mainForm').reset();
    document.getElementById('propId').value = generateID();
    document.getElementById('inquiryDate').value = getFormattedDate();

    const waUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(waText)}`;
    window.location.href = waUrl;
  }

  // FETCH GOOGLE SHEET DATA
  function fetchSheetData() {
    if (globalSheetData.length > 1) return;
    document.getElementById('searchStatus').innerText = "⏳ Loading database from Google Sheets...";

    fetch(sheetUriPrimary)
      .then(res => res.json())
      .then(data => handleDataLoad(data))
      .catch(err => {
        fetch(sheetUriFallback)
          .then(res => res.json())
          .then(data => handleDataLoad(data))
          .catch(e => {
            document.getElementById('searchStatus').innerText = "⚠️ Offline mode active.";
          });
      });
  }

  function handleDataLoad(data) {
    if(Array.isArray(data) && data.length > 0) {
      globalSheetData = data;
      document.getElementById('searchStatus').innerText = `✅ Loaded ${data.length} records.`;
      renderSearchResults(data);
      populateBuyerDropdowns(data);
      populatePropertyDropdowns(data);
    }
  }

  // POPULATE BUYERS/TENANTS DROPDOWN
  function populateBuyerDropdowns(data) {
    const buyerSelect = document.getElementById('flowBuyerSelect');
    buyerSelect.innerHTML = `<option value="">-- Select Buyer/Tenant Client --</option>`;

    data.forEach(r => {
      const deal = String(r['BUYER/SELLER/LANDLORD/TENANT/BTS'] || r['DEAL FOR'] || '').toUpperCase();
      if(deal.includes('BUYER') || deal.includes('TENANT')) {
        const id = r['Property ID'] || r['SR NO'] || 'N/A';
        const name = r['Name'] || r['PERSON NAME'] || 'Unknown';
        const company = r['Company Name'] || '';
        const label = `ID: ${id} | ${name} ${company ? '(' + company + ')' : ''} [${deal}]`;
        buyerSelect.innerHTML += `<option value="${id}">${label}</option>`;
      }
    });
  }

  // POPULATE MATCHING PROPERTY DROPDOWNS (MAX 5)
  function populatePropertyDropdowns(data) {
    const propertyDropdowns = document.querySelectorAll('.match-prop-dd');
    
    propertyDropdowns.forEach(dd => {
      dd.innerHTML = `<option value="">None</option>`;
      data.forEach(r => {
        const id = r['Property ID'] || r['SR NO'] || 'N/A';
        const type = r['Type of Property'] || r['TYPE'] || '';
        const area = r['Area'] || r['AREA'] || '';
        const label = `ID ${id} - ${type} (${area})`;
        dd.innerHTML += `<option value="${id}">${label}</option>`;
      });
    });
  }

  // SEARCH FILTER LOGIC
  function renderSearchResults(data) {
    const container = document.getElementById('searchResultsContainer');
    if (!data || data.length === 0) {
      container.innerHTML = `<p class="text-center text-muted my-3">No matching properties found.</p>`;
      return;
    }

    let html = `<table class="table table-sm table-hover table-mobile-card mb-0">
      <thead class="table-dark"><tr>
        <th>ID</th><th>Type</th><th>Deal For</th><th>Area</th><th>Client</th><th>Contact</th>
      </tr></thead><tbody>`;

    data.forEach(row => {
      const pId = row['Property ID'] || row['SR NO'] || '-';
      const pType = row['Type of Property'] || row['TYPE'] || '-';
      const pDeal = row['BUYER/SELLER/LANDLORD/TENANT/BTS'] || row['DEAL FOR'] || '-';
      const pArea = row['Area'] || row['AREA'] || '-';
      const pName = row['Name'] || row['PERSON NAME'] || '-';
      const pPhone = row['Contact Number'] || row['Mobile'] || '-';

      html += `<tr>
        <td data-label="Prop ID" class="fw-bold">${pId}</td>
        <td data-label="Type">${pType}</td>
        <td data-label="Deal"><span class="badge bg-success">${pDeal}</span></td>
        <td data-label="Area">${pArea}</td>
        <td data-label="Client">${pName}</td>
        <td data-label="Contact">${pPhone}</td>
      </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  function applyFilters() {
    const typeVal = document.getElementById('filterType').value.trim().toLowerCase();
    const dealVal = document.getElementById('filterDeal').value.trim().toLowerCase();
    const keyVal = document.getElementById('filterKeyword').value.trim().toLowerCase();

    const filtered = globalSheetData.filter(r => {
      const type = String(r['Type of Property'] || r['TYPE'] || '').toLowerCase();
      const deal = String(r['BUYER/SELLER/LANDLORD/TENANT/BTS'] || r['DEAL FOR'] || '').toLowerCase();
      const all = Object.values(r).join(' ').toLowerCase();

      const matchType = !typeVal || type.includes(typeVal);
      const matchDeal = !dealVal || deal.includes(dealVal);
      const matchKey = !keyVal || all.includes(keyVal);

      return matchType && matchDeal && matchKey;
    });

    renderSearchResults(filtered);
  }

  function resetFilters() {
    document.getElementById('filterType').value = '';
    document.getElementById('filterDeal').value = '';
    document.getElementById('filterKeyword').value = '';
    renderSearchResults(globalSheetData);
  }

  // REMINDERS FLOWCHART LOGIC
  function addFollowupEntry() {
    const exec = document.getElementById('flowExec').value;
    const buyerId = document.getElementById('flowBuyerSelect').value;
    
    // Collect non-empty matched property IDs (Max 5)
    let selectedProps = [];
    for(let i=1; i<=5; i++) {
      const val = document.getElementById(`matchProp${i}`).value;
      if(val) selectedProps.push(val);
    }

    const propIdsStr = selectedProps.join(', ');
    const visitDate = document.getElementById('flowVisitDate').value;
    const status = document.getElementById('flowStatus').value;
    const response = document.getElementById('flowResponse').value;
    const nextDate = document.getElementById('flowNextDate').value;

    if (!buyerId || selectedProps.length === 0 || !nextDate) {
      alert("Please select Buyer Client, at least 1 Matched Property ID, and Next Date.");
      return;
    }

    const node = { exec, buyerId, propIds: propIdsStr, visitDate, status, response, nextDate, created: new Date().toLocaleDateString() };
    followUpNodes.unshift(node);
    localStorage.setItem('twg_reminders', JSON.stringify(followUpNodes));

    renderTimeline();
    alert("✅ Follow-up flowchart node added!");
  }

  function renderTimeline() {
    const container = document.getElementById('timelineContainer');
    if (followUpNodes.length === 0) {
      container.innerHTML = `<p class="text-muted text-center my-3">No follow-up reminders added yet.</p>`;
      return;
    }

    let html = '';
    followUpNodes.forEach(node => {
      html += `
      <div class="timeline-step">
        <div class="d-flex justify-content-between align-items-center">
          <span class="badge bg-primary">👨‍💼 Executive: ${node.exec}</span>
          <small class="text-muted">${node.created}</small>
        </div>
        <div class="fw-bold mt-1">START: Buyer/Tenant ID: ${node.buyerId}</div>
        <div class="text-success fw-semibold">MATCH LIST SELECTED: Property IDs: ${node.propIds}</div>
        <div class="mt-1">
          📅 <strong>Visit (${node.visitDate}):</strong> Status: <span class="badge bg-info text-dark">${node.status}</span>
        </div>
        <div class="small text-secondary mt-1">
          💬 <strong>Response:</strong> "${node.response || 'Pending'}"
        </div>
        <div class="mt-1 bg-warning bg-opacity-25 p-2 rounded border border-warning">
          🔔 <strong>FOLLOW-UP REMINDER SET:</strong> <u>${node.nextDate}</u> | Call Buyer ID ${node.buyerId}
        </div>
      </div>`;
    });

    container.innerHTML = html;
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Inquiry Form</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7f6;
      font-family: Arial, sans-serif;
      padding: 15px;
    }
    .app-card {
      max-width: 850px;
      margin: auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 25px;
      border-top: 6px solid #198754;
    }
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
    }
    .company-info {
      text-align: center;
      flex-grow: 1;
    }
    .search-btn-top {
      border-radius: 20px;
      font-weight: bold;
    }
    .section-title {
      background-color: #e8f5e9;
      color: #1b5e20;
      padding: 8px 15px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 15px;
    }
    /* Compact Table Styles */
    .table-custom th {
      background-color: #198754;
      color: white;
      font-size: 13px;
      white-space: nowrap;
    }
    .table-custom td {
      font-size: 12px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .detail-label {
      font-weight: bold;
      color: #198754;
      width: 35%;
    }
  </style>
</head>
<body>

<div class="app-card">
  
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="company-info">
      <h5 class="fw-bold mb-1">THE WAREHOUSE GURUZ</h5>
      <p class="mb-0 text-muted small">A 703, SIGNATURE-2, SANAND CROSS ROAD, SARKHEJ, AHMEDABAD-382210</p>
      <p class="mb-0 text-muted small"><strong>Mobile:</strong> +91 6351207989</p>
    </div>
    <div>
      <button type="button" class="btn btn-outline-success search-btn-top" data-bs-toggle="modal" data-bs-target="#searchModal">
        🔍 Search Database
      </button>
    </div>
  </div>

  <h3 class="text-center text-success fw-bold mb-4">PROPERTY INQUIRY FORM</h3>

  <form id="inquiryForm">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Property ID</label>
        <input type="text" class="form-control" id="propertyId">
      </div>
      <div class="col-md-6">
        <label class="form-label">Inquiry Date</label>
        <input type="date" class="form-control" id="inquiryDate">
      </div>
    </div>

    <div class="section-title">1. CLIENT INFO</div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Person Name *</label>
        <input type="text" class="form-control" placeholder="Full Name" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Contact Mobile *</label>
        <input type="tel" class="form-control" placeholder="9876543210" required>
      </div>
      <div class="col-md-12">
        <label class="form-label">Company Name</label>
        <input type="text" class="form-control" placeholder="Company Name (Optional)">
      </div>
    </div>

    <div class="section-title">2. PROPERTY DETAILS</div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Property Type *</label>
        <select class="form-select" required>
          <option value="">Select</option>
          <option value="WAREHOUSE">WAREHOUSE</option>
          <option value="INDUSTRIAL PLOT">INDUSTRIAL PLOT</option>
          <option value="LAND">LAND</option>
          <option value="COMMERCIAL">COMMERCIAL</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Deal For *</label>
        <select class="form-select" required>
          <option value="">Select</option>
          <option value="SELLER">SELLER</option>
          <option value="BUYER">BUYER</option>
          <option value="LANDLOARD">LANDLOARD</option>
          <option value="TENANT">TENANT</option>
          <option value="BTS">BTS</option>
          <option value="PRE-LEASE">PRE-LEASE</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Size *</label>
        <input type="number" class="form-control" placeholder="Number" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Unit *</label>
        <select class="form-select" required>
          <option value="SQ.FT.">SQ.FT.</option>
          <option value="SQ.YARDS">SQ.YARDS</option>
          <option value="ACRE">ACRE</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Area / Location *</label>
        <input type="text" class="form-control" placeholder="e.g. Changodar" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Budget</label>
        <input type="text" class="form-control" placeholder="Expected Budget">
      </div>
    </div>

    <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-3">Submit Inquiry</button>
  </form>
</div>

<!-- MULTI-SEARCH MODAL -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">🔍 Multi-Search Property Database</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
        <!-- Search Filters Container -->
        <div class="row g-2 mb-3">
          <div class="col-md-3">
            <label class="form-label fw-bold small">Property Type</label>
            <select id="filterType" class="form-select" onchange="applyFilters()">
              <option value="">All Types</option>
              <option value="WAREHOUSE">WAREHOUSE</option>
              <option value="INDUSTRIAL PLOT">INDUSTRIAL PLOT</option>
              <option value="LAND">LAND</option>
              <option value="COMMERCIAL">COMMERCIAL</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Deal For</label>
            <select id="filterDeal" class="form-select" onchange="applyFilters()">
              <option value="">All Deals</option>
              <option value="SELLER">SELLER</option>
              <option value="BUYER">BUYER</option>
              <option value="LANDLORD">LANDLORD</option>
              <option value="TENANT">TENANT</option>
              <option value="BTS">BTS</option>
              <option value="PRE-LEASE">PRE-LEASE</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Area / Location</label>
            <input type="text" id="filterArea" class="form-control" placeholder="Search Location" oninput="applyFilters()" onkeyup="if(event.key==='Enter') applyFilters()">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Keyword Search</label>
            <input type="text" id="filterKeyword" class="form-control" placeholder="Name, Phone, ID..." oninput="applyFilters()" onkeyup="if(event.key==='Enter') applyFilters()">
          </div>
        </div>

        <!-- Confirm Search & Action Buttons -->
        <div class="d-flex gap-2 mb-3">
          <button type="button" class="btn btn-success fw-bold px-4" onclick="applyFilters()">🔍 Search Now</button>
          <button type="button" class="btn btn-outline-secondary" onclick="resetFilters()">Reset Filters</button>
        </div>

        <!-- Status Box & Table Results -->
        <div id="searchStatus" class="alert alert-info py-2 small">Loading database from Google Sheets...</div>
        <div id="searchResultsContainer" class="table-responsive" style="max-height: 420px; overflow-y: auto;"></div>

      </div>
    </div>
  </div>
</div>

<!-- SINGLE RECORD FULL DETAILS MODAL -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white py-2">
        <h5 class="modal-title fs-6 fw-bold">📋 Full Property Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3">
        <div id="fullDetailContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const sheetId = "1zbB4PFbgtKpYc06MjkGqSTeAVOYpnRznDidvWoANEeA";
  const tabName = encodeURIComponent("Property Database");
  const sheetUri = `https://opensheet.elk.sh/${sheetId}/${tabName}`;
  
  let globalSheetData = [];

  document.addEventListener("DOMContentLoaded", function () {
    const modalElem = document.getElementById('searchModal');
    if (modalElem) {
      modalElem.addEventListener('shown.bs.modal', function () {
        fetchSheetData();
      });
    }
  });

  function fetchSheetData() {
    if (globalSheetData.length > 0) return;

    document.getElementById('searchStatus').innerText = "⏳ Loading database from Google Sheets...";

    fetch(sheetUri)
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) {
          fetchFallbackData();
          return;
        }
        globalSheetData = data;
        document.getElementById('searchStatus').innerText = `✅ Loaded ${data.length} records successfully.`;
        renderSearchResults(data);
      })
      .catch(err => {
        fetchFallbackData();
      });
  }

  function fetchFallbackData() {
    const fallbackUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
    fetch(fallbackUrl)
      .then(r => r.text())
      .then(txt => {
        const json = JSON.parse(txt.substring(47, txt.length - 2));
        const cols = json.table.cols.map(c => (c && c.label) ? c.label : '');
        const rows = json.table.rows.map(r => {
          let obj = {};
          if (r.c) {
            r.c.forEach((cell, idx) => {
              const colName = cols[idx] || `Col_${idx}`;
              obj[colName] = cell ? (cell.v !== null ? cell.v : '') : '';
            });
          }
          return obj;
        });
        globalSheetData = rows;
        document.getElementById('searchStatus').innerText = `✅ Loaded ${rows.length} records directly.`;
        renderSearchResults(rows);
      })
      .catch(fallbackErr => {
        document.getElementById('searchStatus').innerText = "❌ Unable to load sheet data. Check Google Sheet sharing permissions.";
      });
  }

  function applyFilters() {
    const typeVal = document.getElementById('filterType').value.toLowerCase().trim();
    const dealVal = document.getElementById('filterDeal').value.toLowerCase().trim();
    const areaVal = document.getElementById('filterArea').value.toLowerCase().trim();
    const keywordVal = document.getElementById('filterKeyword').value.toLowerCase().trim();

    const filtered = globalSheetData.filter(row => {
      const rowType = String(row['Type of Property'] || row['Property Type'] || row['TYPE'] || '').toLowerCase();
      const rowDeal = String(row['Deal For'] || row['DEAL FOR'] || row['Deal'] || '').toLowerCase();
      const rowArea = String(row['AREA'] || row['Location'] || row['Area'] || '').toLowerCase();

      const matchesType = !typeVal || rowType.includes(typeVal);
      const matchesDeal = !dealVal || rowDeal.includes(dealVal);
      const matchesArea = !areaVal || rowArea.includes(areaVal);

      const matchesKeyword = !keywordVal || Object.values(row).some(val =>
        String(val).toLowerCase().includes(keywordVal)
      );

      return matchesType && matchesDeal && matchesArea && matchesKeyword;
    });

    renderSearchResults(filtered);
    document.getElementById('searchStatus').innerText = `Showing ${filtered.length} matching records.`;
  }

  function resetFilters() {
    document.getElementById('filterType').value = "";
    document.getElementById('filterDeal').value = "";
    document.getElementById('filterArea').value = "";
    document.getElementById('filterKeyword').value = "";
    applyFilters();
  }

  function renderSearchResults(data) {
    const container = document.getElementById('searchResultsContainer');
    if (!data || data.length === 0) {
      container.innerHTML = `<p class="text-center text-muted my-3">No matching properties found.</p>`;
      return;
    }

    let tableHtml = `<table class="table table-hover table-bordered table-custom mb-0">
      <thead><tr>
        <th>Action</th>
        <th>ID</th>
        <th>Type</th>
        <th>Deal For</th>
        <th>Area / Location</th>
        <th>Contact / Owner</th>
      </tr></thead><tbody>`;

    data.forEach((row, index) => {
      const id = row['SR NO'] || row['ID'] || row['Property ID'] || index + 1;
      const type = row['Type of Property'] || row['Property Type'] || row['TYPE'] || '-';
      const deal = row['Deal For'] || row['DEAL FOR'] || row['Deal'] || '-';
      const area = row['AREA'] || row['Location'] || row['Area'] || '-';
      const contact = row['PERSON NAME'] || row['Mobile'] || row['Name'] || row['Contact'] || '-';

      tableHtml += `<tr>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-success py-0 px-2 fw-bold" onclick="showRecordDetails(${index})">👁️ View</button>
        </td>
        <td class="fw-bold">${id}</td>
        <td>${type}</td>
        <td><span class="badge bg-secondary">${deal}</span></td>
        <td>${area}</td>
        <td>${contact}</td>
      </tr>`;
    });

    tableHtml += `</tbody></table>`;
    container.innerHTML = tableHtml;
  }

  function showRecordDetails(index) {
    const record = globalSheetData[index];
    if (!record) return;

    let detailHtml = `<table class="table table-striped table-sm border"><tbody>`;
    for (let key in record) {
      if (record[key] !== undefined && record[key] !== null && String(record[key]).trim() !== '') {
        detailHtml += `<tr>
          <td class="detail-label">${key}</td>
          <td>${record[key]}</td>
        </tr>`;
      }
    }
    detailHtml += `</tbody></table>`;

    document.getElementById('fullDetailContent').innerHTML = detailHtml;
    const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
    detailModal.show();
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Warehouse Guruz - Property Form</title>

  <!-- Mobile Web App & PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TWG Form">
  <meta name="theme-color" content="#004d40">

  <!-- App Icon for Home Screen -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/thewarehouseguruz/property-form/main/TWG%20LOGO%20PNG.png">
  <link rel="icon" sizes="192x192" href="https://raw.githubusercontent.com/thewarehouseguruz/property-form/main/TWG%20LOGO%20PNG.png">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --primary-color: #004d40;
      --secondary-color: #00796b;
      --accent-color: #e0f2f1;
      --bg-color: #f4f6f8;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 10px;
      color: #333;
    }

    .app-card {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      border-top: 5px solid var(--primary-color);
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
    }

    .brand-logo {
      max-width: 200px;
      height: auto;
      margin-bottom: 8px;
    }

    .company-info {
      text-align: center;
      font-size: 11px;
      color: #555;
      line-height: 1.3;
      flex-grow: 1;
    }

    .section-title {
      background-color: var(--accent-color);
      color: var(--primary-color);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      margin-top: 15px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 3px;
      color: #2c3e50;
    }

    .form-control, .form-select {
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #ced4da;
    }

    .btn-action {
      padding: 12px;
      font-weight: 600;
      border-radius: 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .search-btn-top {
      border-radius: 20px;
      font-weight: bold;
    }

    /* Compact Table Styles */
    .table-custom th {
      background-color: #198754;
      color: white;
      font-size: 13px;
      white-space: nowrap;
    }
    .table-custom td {
      font-size: 12px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .detail-label {
      font-weight: bold;
      color: #198754;
      width: 35%;
    }
  </style>
</head>
<body>

<div class="app-card">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="text-center">
      <img src="TWG LOGO PNG.png" alt="THE WAREHOUSE GURUZ" class="brand-logo" onerror="this.src='https://raw.githubusercontent.com/thewarehouseguruz/property-form/main/TWG%20LOGO%20PNG.png'">
    </div>
    <div class="company-info">
      <strong>THE WAREHOUSE GURUZ</strong><br>
      A 703, SIGNATURE-2, SANAND CROSS ROAD, SARKHEJ, AHMEDABAD-382210<br>
      <strong>Mobile:</strong> +91 6351207989
    </div>
    <div class="mt-2 mt-md-0">
      <button type="button" class="btn btn-outline-success search-btn-top" data-bs-toggle="modal" data-bs-target="#searchModal">
        🔍 Search Database
      </button>
    </div>
  </div>

  <h5 class="text-center fw-bold text-success mb-3">PROPERTY INQUIRY FORM</h5>

  <form id="mainForm" onsubmit="event.preventDefault();">
    <!-- Auto Fields -->
    <div class="row g-2 mb-2">
      <div class="col-6">
        <label class="form-label">Property ID</label>
        <input type="text" id="propId" class="form-control bg-light" readonly>
      </div>
      <div class="col-6">
        <label class="form-label">Inquiry Date</label>
        <input type="text" id="inquiryDate" class="form-control bg-light" readonly>
      </div>
    </div>

    <!-- 1. Client Details -->
    <div class="section-title">1. Client Info</div>
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <label class="form-label">Person Name *</label>
        <input type="text" id="personName" class="form-control" placeholder="Full Name" required>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Contact Mobile *</label>
        <input type="tel" id="contactNumber" class="form-control" placeholder="9876543210" required>
      </div>
      <div class="col-12">
        <label class="form-label">Company Name</label>
        <input type="text" id="companyName" class="form-control" placeholder="Company Name (Optional)">
      </div>
    </div>

    <!-- 2. Property Details -->
    <div class="section-title">2. Property Details</div>
    <div class="row g-2">
      <div class="col-6">
        <label class="form-label">Property Type *</label>
        <select id="propertyType" class="form-select" required>
          <option value="">Select</option>
          <option value="WAREHOUSE">WAREHOUSE</option>
          <option value="INDUSTRIAL PLOT">INDUSTRIAL PLOT</option>
          <option value="LAND">LAND</option>
          <option value="NA LAND">NA LAND</option>
          <option value="AGRICULTURE LAND">AGRICULTURE LAND</option>
          <option value="COMMERCIAL">COMMERCIAL</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Deal For *</label>
        <select id="dealFor" class="form-select" required>
          <option value="">Select</option>
          <option value="SELLER">SELLER</option>
          <option value="BUYER">BUYER</option>
          <option value="LANDLORD">LANDLORD</option>
          <option value="TENANT">TENANT</option>
          <option value="BTS">BTS</option>
          <option value="PRE-LEASE">PRE-LEASE</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Size *</label>
        <input type="text" id="propertySize" class="form-control" placeholder="Number" required>
      </div>
      <div class="col-6">
        <label class="form-label">Unit *</label>
        <select id="sizeUnit" class="form-select" required>
          <option value="SQ.FT.">SQ.FT.</option>
          <option value="SQ.YARD">SQ.YARD</option>
          <option value="SQ.VAR">SQ.VAR</option>
          <option value="VIGHA">VIGHA</option>
          <option value="ACRE">ACRE</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Area / Location *</label>
        <input type="text" id="area" class="form-control" placeholder="Location" required>
      </div>
      <div class="col-6">
        <label class="form-label">Budget</label>
        <input type="text" id="budget" class="form-control" placeholder="Budget Details">
      </div>
      <div class="col-6">
        <label class="form-label">Purpose</label>
        <input type="text" id="purpose" class="form-control" placeholder="e.g. Storage">
      </div>
      <div class="col-6">
        <label class="form-label">Fire NOC</label>
        <select id="fireNoc" class="form-select">
          <option value="N/A">Select</option>
          <option value="YES">YES</option>
          <option value="NO">NO</option>
          <option value="PENDING">PENDING</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Detailed Address</label>
        <textarea id="address" class="form-control" rows="2" placeholder="Full Address"></textarea>
      </div>
    </div>

    <!-- 3. Location & Remarks -->
    <div class="section-title">3. Location & Remarks</div>
    <div class="row g-2">
      <div class="col-12">
        <label class="form-label">Google Maps Location Link</label>
        <div class="input-group mb-1">
          <input type="url" id="locationLink" class="form-control" placeholder="https://maps.google.com/...">
          <button type="button" class="btn btn-outline-success btn-sm" onclick="getCurrentLocation()">📍 Get Current Location</button>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label">Remarks</label>
        <textarea id="remarks" class="form-control" rows="2" placeholder="Specific Requirements"></textarea>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="row g-2 mt-3">
      <div class="col-6">
        <button type="button" class="btn btn-outline-danger btn-action w-100" onclick="clearForm()">
          🧹 Clear Form
        </button>
      </div>
      <div class="col-6">
        <button type="button" class="btn btn-warning btn-action w-100 fw-bold" onclick="manualSave()">
          ☁️ Save Record
        </button>
      </div>
      <div class="col-12 col-md-6">
        <button type="button" class="btn btn-success btn-action w-100" onclick="sendWhatsApp('company')">
          📱 Send Company WhatsApp
        </button>
      </div>
      <div class="col-12 col-md-6">
        <button type="button" class="btn btn-primary btn-action w-100" onclick="sendWhatsApp('customer')">
          💬 Send Customer WhatsApp
        </button>
      </div>
    </div>
  </form>
</div>

<!-- MULTI-SEARCH MODAL -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">🔍 Multi-Search Property Database</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
        <!-- Search Filters Container -->
        <div class="row g-2 mb-3">
          <div class="col-md-3">
            <label class="form-label fw-bold small">Property Type</label>
            <select id="filterType" class="form-select" onchange="applyFilters()">
              <option value="">All Types</option>
              <option value="WAREHOUSE">WAREHOUSE</option>
              <option value="INDUSTRIAL PLOT">INDUSTRIAL PLOT</option>
              <option value="LAND">LAND</option>
              <option value="COMMERCIAL">COMMERCIAL</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Deal For</label>
            <select id="filterDeal" class="form-select" onchange="applyFilters()">
              <option value="">All Deals</option>
              <option value="SELLER">SELLER</option>
              <option value="BUYER">BUYER</option>
              <option value="LANDLORD">LANDLORD</option>
              <option value="TENANT">TENANT</option>
              <option value="BTS">BTS</option>
              <option value="PRE-LEASE">PRE-LEASE</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Area / Location</label>
            <input type="text" id="filterArea" class="form-control" placeholder="Search Location" oninput="applyFilters()" onkeyup="if(event.key==='Enter') applyFilters()">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Keyword Search</label>
            <input type="text" id="filterKeyword" class="form-control" placeholder="Name, Phone, ID..." oninput="applyFilters()" onkeyup="if(event.key==='Enter') applyFilters()">
          </div>
        </div>

        <!-- Confirm Search & Action Buttons -->
        <div class="d-flex gap-2 mb-3">
          <button type="button" class="btn btn-success fw-bold px-4" onclick="applyFilters()">🔍 Search Now</button>
          <button type="button" class="btn btn-outline-secondary" onclick="resetFilters()">Reset Filters</button>
        </div>

        <!-- Status Box & Table Results -->
        <div id="searchStatus" class="alert alert-info py-2 small">Loading database from Google Sheets...</div>
        <div id="searchResultsContainer" class="table-responsive" style="max-height: 420px; overflow-y: auto;"></div>

      </div>
    </div>
  </div>
</div>

<!-- SINGLE RECORD FULL DETAILS MODAL -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white py-2">
        <h5 class="modal-title fs-6 fw-bold">📋 Full Property Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3">
        <div id="fullDetailContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Firebase Setup
  const firebaseConfig = {
    databaseURL: "https://thewarehouseguruz-default-rtdb.firebaseio.com"
  };

  let db = null;
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
  } catch (e) {
    console.warn("Firebase initialized in offline mode.", e);
  }

  function generateID() {
    return 'PROP-' + Math.floor(100000 + Math.random() * 900000);
  }

  function getFormattedDate() {
    const d = new Date();
    return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
  }

  function resetAutoFields() {
    document.getElementById('propId').value = generateID();
    document.getElementById('inquiryDate').value = getFormattedDate();
  }

  document.addEventListener('DOMContentLoaded', resetAutoFields);

  function getCurrentLocation() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        document.getElementById('locationLink').value = `https://maps.google.com/?q=${lat},${lng}`;
        alert("📍 Location captured successfully!");
      }, (error) => {
        alert("Unable to fetch location. Grant GPS permissions in browser.");
      });
    } else {
      alert("Geolocation is not supported by your browser.");
    }
  }

  function clearForm() {
    if (confirm("Are you sure you want to clear all form entries?")) {
      document.getElementById('mainForm').reset();
      resetAutoFields();
    }
  }

  function collectFormData() {
    return {
      propId: document.getElementById('propId').value,
      inquiryDate: document.getElementById('inquiryDate').value,
      personName: document.getElementById('personName').value,
      contactNumber: document.getElementById('contactNumber').value,
      companyName: document.getElementById('companyName').value || 'N/A',
      propertyType: document.getElementById('propertyType').value,
      dealFor: document.getElementById('dealFor').value,
      propertySize: document.getElementById('propertySize').value + ' ' + document.getElementById('sizeUnit').value,
      area: document.getElementById('area').value,
      budget: document.getElementById('budget').value || 'N/A',
      purpose: document.getElementById('purpose').value || 'N/A',
      fireNoc: document.getElementById('fireNoc').value,
      address: document.getElementById('address').value || 'N/A',
      locationLink: document.getElementById('locationLink').value || 'N/A',
      remarks: document.getElementById('remarks').value || 'None'
    };
  }

  function saveSilent() {
    const data = collectFormData();
    if (!data.personName || !data.contactNumber) {
      return Promise.reject("Required fields missing.");
    }
    
    if (db) {
      return db.ref('inquiries').push(data);
    } else {
      return Promise.reject("Firebase DB not initialized.");
    }
  }

  async function manualSave() {
    const form = document.getElementById('mainForm');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    
    try {
      await saveSilent();
      alert("✅ Record Saved Successfully!");
      resetAutoFields();
    } catch (err) {
      console.error("Save Error:", err);
      alert("❌ Save failed: " + (err.message || err));
    }
  }

  function sendWhatsApp(target) {
    const form = document.getElementById('mainForm');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const data = collectFormData();

    let waText = `*PROPERTY INQUIRY DETAILS*\n`;
    waText += `*ID:* ${data.propId} | *Date:* ${data.inquiryDate}\n`;
    waText += `---------------------------------\n`;
    waText += `👤 *Name:* ${data.personName}\n`;
    waText += `📞 *Contact:* ${data.contactNumber}\n`;
    waText += `🏢 *Company:* ${data.companyName}\n`;
    waText += `🏗️ *Type:* ${data.propertyType}\n`;
    waText += `🤝 *Deal For:* ${data.dealFor}\n`;
    waText += `📐 *Size:* ${data.propertySize}\n`;
    waText += `📍 *Location:* ${data.area}\n`;
    waText += `💰 *Budget:* ${data.budget}\n`;
    waText += `🔥 *Fire NOC:* ${data.fireNoc}\n`;
    waText += `🎯 *Purpose:* ${data.purpose}\n`;
    waText += `📍 *Address:* ${data.address}\n`;
    if(data.locationLink !== 'N/A') waText += `🗺️ *Location:* ${data.locationLink}\n`;
    waText += `📝 *Remarks:* ${data.remarks}\n`;
    waText += `---------------------------------\n`;
    waText += `*The Warehouse Guruz*`;

    let cleanPhone = data.contactNumber.replace(/\D/g, '');
    if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

    let targetPhone = (target === 'company') ? '916351207989' : cleanPhone;
    
    saveSilent().then(() => {
      resetAutoFields();
    }).catch((err) => {
      console.warn("Background save warning:", err);
    });

    const waUrl = `https://api.whatsapp.com/send?phone=${targetPhone}&text=${encodeURIComponent(waText)}`;
    window.location.href = waUrl;
  }

  // Google Sheets Multi-Search Logic
  const sheetId = "1zbB4PFbgtKpYc06MjkGqSTeAVOYpnRznDidvWoANEeA";
  const tabName = encodeURIComponent("Property Database");
  const sheetUri = `https://opensheet.elk.sh/${sheetId}/${tabName}`;
  
  let globalSheetData = [];
  let filteredSheetData = [];

  document.addEventListener("DOMContentLoaded", function () {
    const modalElem = document.getElementById('searchModal');
    if (modalElem) {
      modalElem.addEventListener('shown.bs.modal', function () {
        fetchSheetData();
      });
    }
  });

  function getFieldValue(row, possibleKeys) {
    if (!row) return '';
    for (let key of possibleKeys) {
      if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
        return String(row[key]).trim();
      }
    }
    const keys = Object.keys(row);
    for (let key of keys) {
      const lowerKey = key.trim().toLowerCase();
      for (let pKey of possibleKeys) {
        if (lowerKey === pKey.trim().toLowerCase() || lowerKey.includes(pKey.toLowerCase())) {
          if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
            return String(row[key]).trim();
          }
        }
      }
    }
    return '';
  }

  function fetchSheetData() {
    if (globalSheetData.length > 0) return;

    document.getElementById('searchStatus').innerText = "⏳ Loading database from Google Sheets...";

    fetch(sheetUri)
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) {
          fetchFallbackData();
          return;
        }
        globalSheetData = data;
        filteredSheetData = data;
        document.getElementById('searchStatus').innerText = `✅ Loaded ${data.length} records successfully.`;
        renderSearchResults(data);
      })
      .catch(err => {
        fetchFallbackData();
      });
  }

  function fetchFallbackData() {
    const fallbackUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
    fetch(fallbackUrl)
      .then(r => r.text())
      .then(txt => {
        const json = JSON.parse(txt.substring(47, txt.length - 2));
        const cols = json.table.cols.map(c => (c && c.label) ? c.label : '');
        const rows = json.table.rows.map(r => {
          let obj = {};
          if (r.c) {
            r.c.forEach((cell, idx) => {
              const colName = cols[idx] || `Col_${idx}`;
              obj[colName] = cell ? (cell.v !== null ? cell.v : '') : '';
            });
          }
          return obj;
        });
        globalSheetData = rows;
        filteredSheetData = rows;
        document.getElementById('searchStatus').innerText = `✅ Loaded ${rows.length} records directly.`;
        renderSearchResults(rows);
      })
      .catch(fallbackErr => {
        document.getElementById('searchStatus').innerText = "❌ Unable to load sheet data. Check Google Sheet sharing permissions.";
      });
  }

  function applyFilters() {
    const typeVal = document.getElementById('filterType').value.trim().toLowerCase();
    const dealVal = document.getElementById('filterDeal').value.trim().toLowerCase();
    const areaVal = document.getElementById('filterArea').value.trim().toLowerCase();
    const keywordVal = document.getElementById('filterKeyword').value.trim().toLowerCase();

    filteredSheetData = globalSheetData.filter(row => {
      const rowType = getFieldValue(row, ['Type of Property', 'Property Type', 'TYPE', 'Type']).toLowerCase();
      const rowDeal = getFieldValue(row, ['DEAL FOR', 'Deal For', 'REQUIREMENT', 'Requirement', 'Deal']).toLowerCase();
      const rowArea = getFieldValue(row, ['AREA', 'Area', 'Location', 'AREA LIST']).toLowerCase();

      const matchesType = !typeVal || rowType === typeVal || rowType.includes(typeVal);
      const matchesDeal = !dealVal || rowDeal === dealVal || rowDeal.includes(dealVal);
      const matchesArea = !areaVal || rowArea.includes(areaVal);

      const matchesKeyword = !keywordVal || Object.values(row).some(val =>
        String(val).toLowerCase().includes(keywordVal)
      );

      return matchesType && matchesDeal && matchesArea && matchesKeyword;
    });

    renderSearchResults(filteredSheetData);
    document.getElementById('searchStatus').innerText = `Showing ${filteredSheetData.length} matching records.`;
  }

  function resetFilters() {
    document.getElementById('filterType').value = "";
    document.getElementById('filterDeal').value = "";
    document.getElementById('filterArea').value = "";
    document.getElementById('filterKeyword').value = "";
    applyFilters();
  }

  function renderSearchResults(data) {
    const container = document.getElementById('searchResultsContainer');
    if (!data || data.length === 0) {
      container.innerHTML = `<p class="text-center text-muted my-3">No matching properties found.</p>`;
      return;
    }

    let tableHtml = `<table class="table table-hover table-bordered table-custom mb-0">
      <thead><tr>
        <th>Action</th>
        <th>ID</th>
        <th>Type</th>
        <th>Deal For</th>
        <th>Area / Location</th>
        <th>Contact / Owner</th>
      </tr></thead><tbody>`;

    data.forEach((row, index) => {
      const id = getFieldValue(row, ['Property ID', 'SR NO', 'SR. NO', 'ID']) || (index + 1);
      const type = getFieldValue(row, ['Type of Property', 'Property Type', 'TYPE', 'Type']) || '-';
      const deal = getFieldValue(row, ['DEAL FOR', 'Deal For', 'REQUIREMENT', 'Requirement', 'Deal']);
      const area = getFieldValue(row, ['AREA', 'Area', 'Location', 'AREA LIST']) || '-';
      const contact = getFieldValue(row, ['Name', 'PERSON NAME', 'Owner Name', 'Mobile', 'Contact']) || '-';

      const dealBadgeHtml = deal 
        ? `<span class="badge bg-success">${deal}</span>` 
        : `<span class="text-muted">-</span>`;

      tableHtml += `<tr>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-success py-0 px-2 fw-bold" onclick="showRecordDetails(${index})">👁️ View</button>
        </td>
        <td class="fw-bold">${id}</td>
        <td>${type}</td>
        <td>${dealBadgeHtml}</td>
        <td>${area}</td>
        <td>${contact}</td>
      </tr>`;
    });

    tableHtml += `</tbody></table>`;
    container.innerHTML = tableHtml;
  }

  function showRecordDetails(index) {
    const record = filteredSheetData[index];
    if (!record) return;

    let detailHtml = `<table class="table table-striped table-sm border"><tbody>`;
    for (let key in record) {
      if (record[key] !== undefined && record[key] !== null && String(record[key]).trim() !== '') {
        detailHtml += `<tr>
          <td class="detail-label">${key}</td>
          <td>${record[key]}</td>
        </tr>`;
      }
    }
    detailHtml += `</tbody></table>`;

    document.getElementById('fullDetailContent').innerHTML = detailHtml;
    const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
    detailModal.show();
  }
</script>

</body>
</html>

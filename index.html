<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Inquiry Form</title>
    <!-- Bootstrap 5 CSS for Clean Responsive UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 800px; margin: 30px auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        .form-header { background: linear-gradient(135deg, #128C7E, #075E54); color: white; padding: 20px; border-radius: 10px; margin-bottom: 25px; text-align: center; }
        .btn-whatsapp { background-color: #25D366; color: white; font-weight: bold; font-size: 1.1rem; padding: 12px 25px; border-radius: 8px; border: none; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-whatsapp:hover { background-color: #1ebd56; color: white; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #075E54; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px; margin-top: 20px; margin-bottom: 15px; }
        .readonly-box { background-color: #e9ecef !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-card">
        <div class="form-header">
            <h2 class="m-0">PROPERTY INQUIRY FORM</h2>
            <p class="m-0 small text-light mt-1">Fill out the details below to submit via WhatsApp</p>
        </div>

        <form id="propertyForm">
            <!-- Auto-Generated Fields -->
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Property ID</label>
                    <input type="text" class="form-control readonly-box" id="propertyId" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Inquiry Date</label>
                    <input type="date" class="form-control" id="inquiryDate" required>
                </div>
            </div>

            <!-- Client Info -->
            <div class="section-title">Client & Contact Details</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Person Name *</label>
                    <input type="text" class="form-control" id="personName" placeholder="Enter Full Name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Contact Number *</label>
                    <input type="tel" class="form-control" id="contactNumber" placeholder="Enter Mobile Number" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-bold">Company Name</label>
                    <input type="text" class="form-control" id="companyName" placeholder="Enter Company Name (Optional)">
                </div>
            </div>

            <!-- Property Specification -->
            <div class="section-title">Property Details</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Type of Property *</label>
                    <select class="form-select" id="propertyType" required>
                        <option value="" selected disabled>Select From List</option>
                        <option value="WAREHOUSE">WAREHOUSE</option>
                        <option value="LANDLORD">LANDLORD</option>
                        <option value="INDUSTRIAL PLOT">INDUSTRIAL PLOT</option>
                        <option value="NA LAND">NA LAND</option>
                        <option value="AGRICULTURE LAND">AGRICULTURE LAND</option>
                        <option value="COMMERCIAL">COMMERCIAL</option>
                        <option value="RESIDENTIAL">RESIDENTIAL</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Deal For *</label>
                    <select class="form-select" id="dealFor" required>
                        <option value="" selected disabled>Select From List</option>
                        <option value="BUYER">BUYER</option>
                        <option value="SELLER">SELLER</option>
                        <option value="LANDLORD">LANDLORD</option>
                        <option value="TENANT">TENANT</option>
                        <option value="BTS">BTS (Build-to-Suit)</option>
                        <option value="PRE-LEASE">PRE-LEASE</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-bold">Property Size *</label>
                    <input type="number" class="form-control" id="propertySize" placeholder="Enter size" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Unit *</label>
                    <select class="form-select" id="sizeUnit" required>
                        <option value="SQ.FT.">SQ.FT.</option>
                        <option value="SQ.YARD">SQ.YARD</option>
                        <option value="VIGHA">VIGHA</option>
                        <option value="ACRE">ACRE</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Area / City / Village *</label>
                    <input type="text" class="form-control" id="area" placeholder="e.g. Changodar, Sanand, Ahmedabad" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Fire NOC *</label>
                    <select class="form-select" id="fireNoc" required>
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                        <option value="PENDING">PENDING</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-bold">Address *</label>
                    <textarea class="form-control" id="address" rows="2" placeholder="Enter complete property address" required></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Purpose</label>
                    <input type="text" class="form-control" id="purpose" placeholder="e.g. Storage, Manufacturing, Investment">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Budget</label>
                    <input type="text" class="form-control" id="budget" placeholder="e.g. 50 Lakhs / 2 Lacs per month">
                </div>
            </div>

            <!-- Links & Media -->
            <div class="section-title">Location & Media Links</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Location Link (Google Maps)</label>
                    <input type="url" class="form-control" id="locationLink" placeholder="https://maps.google.com/...">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Photo / Document Link (Drive/Cloud)</label>
                    <input type="url" class="form-control" id="photoLink" placeholder="https://drive.google.com/...">
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-bold">Remark</label>
                    <textarea class="form-control" id="remark" rows="2" placeholder="Additional notes or requirements"></textarea>
                </div>
            </div>

            <hr class="my-4">

            <!-- Submit Button -->
            <button type="submit" class="btn btn-whatsapp">
                📲 SUBMIT & SEND VIA WHATSAPP
            </button>
        </form>
    </div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR WHATSAPP NUMBER (With Country Code, No + or spaces)
    // Example for India (+91 9876543210) -> "919876543210"
    const MY_WHATSAPP_NUMBER = "919876543210"; 

    // Auto-generate Property ID and Set Today's Date
    document.addEventListener("DOMContentLoaded", function() {
        const randomNum = Math.floor(100000 + Math.random() * 900000);
        document.getElementById("propertyId").value = "PROP-" + randomNum;
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById("inquiryDate").value = today;
    });

    // Handle Form Submission
    document.getElementById("propertyForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const propId = document.getElementById("propertyId").value;
        const inqDate = document.getElementById("inquiryDate").value;
        const personName = document.getElementById("personName").value;
        const contactNum = document.getElementById("contactNumber").value;
        const companyName = document.getElementById("companyName").value || "N/A";
        const propType = document.getElementById("propertyType").value;
        const dealFor = document.getElementById("dealFor").value;
        const propSize = document.getElementById("propertySize").value + " " + document.getElementById("sizeUnit").value;
        const area = document.getElementById("area").value;
        const fireNoc = document.getElementById("fireNoc").value;
        const address = document.getElementById("address").value;
        const purpose = document.getElementById("purpose").value || "N/A";
        const budget = document.getElementById("budget").value || "N/A";
        const locLink = document.getElementById("locationLink").value || "N/A";
        const photoLink = document.getElementById("photoLink").value || "N/A";
        const remark = document.getElementById("remark").value || "N/A";

        // Format WhatsApp Message
        let message = `*🏢 PROPERTY INQUIRY FORM DETAILS*\n`;
        message += `------------------------------------\n`;
        message += `*🆔 Property ID:* ${propId}\n`;
        message += `*📅 Inquiry Date:* ${inqDate}\n\n`;
        message += `*👤 Person Name:* ${personName}\n`;
        message += `*📞 Contact Number:* ${contactNum}\n`;
        message += `*🏢 Company Name:* ${companyName}\n\n`;
        message += `*🏡 Property Type:* ${propType}\n`;
        message += `*🤝 Deal For:* ${dealFor}\n`;
        message += `*📐 Property Size:* ${propSize}\n`;
        message += `*📍 Area/City:* ${area}\n`;
        message += `*🔥 Fire NOC:* ${fireNoc}\n`;
        message += `*📌 Address:* ${address}\n`;
        message += `*🎯 Purpose:* ${purpose}\n`;
        message += `*💰 Budget:* ${budget}\n\n`;
        message += `*🗺️ Location Link:* ${locLink}\n`;
        message += `*🖼️ Photo/Document Link:* ${photoLink}\n`;
        message += `*📝 Remark:* ${remark}\n`;
        message += `------------------------------------`;

        // Open WhatsApp Web/App
        const encodedMessage = encodeURIComponent(message);
        const waUrl = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodedMessage}`;

        window.open(waUrl, "_blank");
    });
</script>

</body>
</html>

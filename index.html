<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Inquiry Form - The Warehouse Guruz</title>
  <!-- html2pdf Library for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary: #0d6efd;
      --secondary: #198754;
      --dark: #212529;
      --light: #f8f9fa;
      --border: #ced4da;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f5;
      margin: 0;
      padding: 20px;
      color: var(--dark);
    }
    .container {
      max-width: 750px;
      background: #ffffff;
      margin: 0 auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }
    .header img {
      max-width: 280px;
      height: auto;
      margin-bottom: 10px;
    }
    .company-address {
      font-size: 13px;
      color: #6c757d;
      line-height: 1.4;
    }
    h2 {
      text-align: center;
      color: #111;
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
    }
    .row {
      display: flex;
      gap: 15px;
    }
    .row .form-group {
      flex: 1;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: white;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-company {
      background-color: #075E54;
    }
    .btn-customer {
      background-color: #25D366;
    }
    .btn-pdf {
      background-color: #d9534f;
    }
  </style>
</head>
<body>

<div class="container" id="printable-area">
  <!-- Header with Logo and Address -->
  <div class="header">
    <img src="https://raw.githubusercontent.com/thewarehouseguruz/property-form/main/TWG%20LOGO%20PNG.png" alt="The Warehouse Guruz Logo">
    <div class="company-address">
      <strong>THE WAREHOUSE GURUZ</strong><br>
      A 703, SIGNATURE-2, SANAND CROSS ROAD, SARKHEJ, AHMEDABAD-382210<br>
      Mobile: +91 6351207989
    </div>
  </div>

  <h2>PROPERTY INQUIRY FORM</h2>

  <form id="inquiryForm">
    <div class="row">
      <div class="form-group">
        <label for="personName">Person Name *</label>
        <input type="text" id="personName" required placeholder="Enter full name">
      </div>
      <div class="form-group">
        <label for="contactNumber">Contact Mobile Number *</label>
        <input type="tel" id="contactNumber" required placeholder="e.g. 9876543210">
      </div>
    </div>

    <div class="form-group">
      <label for="companyName">Company Name</label>
      <input type="text" id="companyName" placeholder="Enter company name (optional)">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="propertyType">Property Type *</label>
        <select id="propertyType" required>
          <option value="">Select Type</option>
          <option value="Warehouse / Godown">Warehouse / Godown</option>
          <option value="Industrial Shed">Industrial Shed</option>
          <option value="Commercial Land / Plot">Commercial Land / Plot</option>
          <option value="Office Space">Office Space</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dealType">Deal For *</label>
        <select id="dealType" required>
          <option value="">Select Option</option>
          <option value="Rent / Lease">Rent / Lease</option>
          <option value="Outright Purchase">Outright Purchase</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="requiredArea">Required Area (Sq.Ft) *</label>
        <input type="text" id="requiredArea" required placeholder="e.g. 10,000 Sq.Ft">
      </div>
      <div class="form-group">
        <label for="preferredLocation">Preferred Location *</label>
        <input type="text" id="preferredLocation" required placeholder="e.g. Changodar, Sanand">
      </div>
    </div>

    <div class="form-group">
      <label for="remarks">Additional Requirements / Remarks</label>
      <textarea id="remarks" rows="3" placeholder="Enter additional details..."></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button type="button" class="btn btn-company" onclick="sendWhatsApp('company')">
        📱 Send to Company (+91 6351207989)
      </button>
      <button type="button" class="btn btn-customer" onclick="sendWhatsApp('customer')">
        💬 Send to Customer WhatsApp
      </button>
      <button type="button" class="btn btn-pdf" onclick="generatePDF()">
        📄 Download PDF Summary
      </button>
    </div>
  </form>
</div>

<script>
  function formatMobileNumber(number) {
    let cleaned = number.replace(/\D/g, '');
    if (cleaned.length === 10) {
      return '91' + cleaned;
    }
    return cleaned;
  }

  function getFormMessage() {
    const name = document.getElementById('personName').value;
    const phone = document.getElementById('contactNumber').value;
    const company = document.getElementById('companyName').value || 'N/A';
    const type = document.getElementById('propertyType').value;
    const deal = document.getElementById('dealType').value;
    const area = document.getElementById('requiredArea').value;
    const location = document.getElementById('preferredLocation').value;
    const remarks = document.getElementById('remarks').value || 'None';

    if (!name || !phone || !type || !deal || !area || !location) {
      alert('Please fill in all required fields marked with *');
      return null;
    }

    let text = `*PROPERTY INQUIRY DETAILS*\n`;
    text += `---------------------------------\n`;
    text += `*Name:* ${name}\n`;
    text += `*Contact:* ${phone}\n`;
    text += `*Company:* ${company}\n`;
    text += `*Property Type:* ${type}\n`;
    text += `*Deal For:* ${deal}\n`;
    text += `*Required Area:* ${area}\n`;
    text += `*Location:* ${location}\n`;
    text += `*Remarks:* ${remarks}\n`;
    text += `---------------------------------\n`;
    text += `*The Warehouse Guruz*\n`;
    text += `A 703, SIGNATURE-2, SANAND CROSS ROAD, SARKHEJ, AHMEDABAD-382210\n`;
    text += `Mobile: +91 6351207989`;

    return { text, phone };
  }

  function sendWhatsApp(target) {
    const data = getFormMessage();
    if (!data) return;

    let targetPhone = '';
    if (target === 'company') {
      targetPhone = '916351207989';
    } else {
      targetPhone = formatMobileNumber(data.phone);
    }

    const url = `https://wa.me/${targetPhone}?text=${encodeURIComponent(data.text)}`;
    window.open(url, '_blank');
  }

  function generatePDF() {
    const name = document.getElementById('personName').value || 'Inquiry';
    const element = document.getElementById('printable-area');
    const opt = {
      margin:       0.5,
      filename:     `Property_Inquiry_${name}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
  }
</script>

</body>
</html>
